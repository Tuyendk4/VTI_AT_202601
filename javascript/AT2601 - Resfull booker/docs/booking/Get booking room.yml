info:
  name: Get booking room
  type: http
  seq: 4

http:
  method: GET
  url: "{{bookingUrl}}/booking/?roomId=1"
  params:
    - name: roomId
      value: "1"
      type: query
  body:
    type: text
    data: |-
      {
        "bookingid": 1,
        "roomid": 1,
        "firstname": "James",
        "lastname": "Dean",
        "depositpaid": true,
        "email": "james_dean@example.com",
        "phone": "092345678387",
        "bookingdates": {
          "checkin": "2026-07-27",
          "checkout": "2026-07-27"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
