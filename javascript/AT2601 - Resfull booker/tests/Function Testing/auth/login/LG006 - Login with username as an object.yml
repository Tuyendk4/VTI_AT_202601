info:
  name: LG006 - Login with username as an object
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": {{username}},
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let username = {"username": "admin"};
        bru.setVar("username", username);
    - type: after-response
      code: |-
        test("Status code is 400", function () {
            expect(res.getStatus()).to.equal(400);
        });

        test("Status in response body is 400", function() {
            expect(res.getBody().status).to.be.a("number");
            expect(res.getBody().status).to.eql(400); // pm.response.json() = $ => $.status
        });

        test("Error in response body is 'Bad Request'", function() {
            expect(res.getBody().error).to.be.a("string");
            expect(res.getBody().error).to.eql("Bad Request");
        });

        test("Path in response body is /auth/login", function() {
            expect(res.getBody().path).to.be.a("string");
            expect(res.getBody().path).to.eql("/auth/login");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
