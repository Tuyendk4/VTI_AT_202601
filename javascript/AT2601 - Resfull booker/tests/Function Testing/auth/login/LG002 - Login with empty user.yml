info:
  name: LG002 - Login with empty user
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let username = "";
        bru.setVar("username", username);
    - type: after-response
      code: |-
        test("Status code is 403", function () {
            expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
