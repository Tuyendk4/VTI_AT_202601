info:
  name: LG009 - Login with usename as sql injection
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
          "username": "{{username}}",
          "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let username = "SELECT * FROM members WHERE username = 'admin'--' AND password = 'password'";
        bru.setVar("username", username);
    - type: after-response
      code: |-
        test("Status code is 403", function () {
            expect(res.getStatus()).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
