info:
  name: LG010 - Login with GET method
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
          "username": "{{username}}",
          "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let username = "SELECT * FROM members WHERE username = 'admin'--' AND password = 'password'";
        bru.setVar("username", username);
    - type: after-response
      code: |-
        test("Status code is 405", function () {
            expect(res.getStatus()).to.equal(405);
        });

        test("Status in response body is 405", function() {
            expect(res.getBody().status).to.be.a("number");
            expect(res.getBody().status).to.eql(405); // pm.response.json() = $ => $.status
        });

        test("Error in response body is 'Method Not Allowed'", function() {
            expect(res.getBody().error).to.be.a("string");
            expect(res.getBody().error).to.eql("Method Not Allowed");
        });

        test("Path in response body is /auth/login", function() {
            expect(res.getBody().path).to.be.a("string");
            expect(res.getBody().path).to.eql("/auth/login");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
