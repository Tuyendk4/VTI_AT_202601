runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Cookies have token attribute", function () {
            expect(bru.cookies.get("token")).to.not.be.null;
            expect(bru.cookies.get("token")).to.be.a("string");
        });

        console.log("Token: " + bru.cookies.get("token"));

        bru.setVar("token", bru.cookies.get("token"));

