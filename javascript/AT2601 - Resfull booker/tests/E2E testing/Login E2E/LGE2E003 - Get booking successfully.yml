info:
  name: LGE2E003 - Get booking successfully
  type: http
  seq: 3

http:
  method: GET
  url: "{{bookingUrl}}/booking/{{bookingId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        let bookingId = 1;
        bru.setVar("bookingId", bookingId)
    - type: after-response
      code: |-
        const moment = require('moment');

        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Booking ID matches the request", function () {
            const bookingIdFromResponse = res.getBody().bookingid;
            expect(bookingIdFromResponse).to.be.a("number");
            expect(bookingIdFromResponse).to.equal(bru.getVar("bookingId"));
        });

        test("Check-in date is correct", function () {
            const checkinDate = res.getBody().bookingdates.checkin;
            expect(checkinDate).to.be.a("string");
            const isValidDate = moment(checkinDate, "YYYY-MM-DD", true).isValid();
            expect(isValidDate).to.be.true;
        });

        test("Check-out date is correct", function () {
            const checkoutDate = res.getBody().bookingdates.checkout;
            expect(checkoutDate).to.be.a("string");
            const isValidDate = moment(checkoutDate, "YYYY-MM-DD", true).isValid();
            expect(isValidDate).to.be.true;
        });

        test("depositpaid is correct", function () {
            expect(res.getBody().depositpaid).to.be.a("boolean");
        });

        test("firstname is correct", function () {
            expect(res.getBody().firstname).to.be.a("string");
        });

        test("lastname is correct", function () {
            expect(res.getBody().lastname).to.be.a("string");
        });

        test("roomid is correct", function () {
            expect(res.getBody().roomid).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
